appId: com.biswakarma.cashbill
productName: CashBill
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
linux:
  target:
    - AppImage
  category: Office
win:
  target:
    - portable
portable:
  artifactName: ${productName}-${version}-portable.${ext}
