appId: com.biswakarma.cashbill
productName: CashBill
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
linux:
  target:
    - AppImage
  icon: public/icon.png
  category: Office
win:
  target:
    - portable
  icon: public/icon.ico
mac:
  icon: public/icon.icns
portable:
  artifactName: ${productName}-${version}.${ext}
